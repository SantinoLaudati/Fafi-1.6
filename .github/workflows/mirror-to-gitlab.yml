name: Sincronizar GitHub a GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar todo el historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar ramas y etiquetas a GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/danteiglesias/fafi-1.6.git"
          git push --force gitlab "refs/heads/*:refs/heads/*"
          git push --force gitlab "refs/tags/*:refs/tags/*"
