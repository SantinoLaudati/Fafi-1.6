version: '3.8'

services:
  # PHP Backend + Nginx + WebSocket
  app:
    build:
      context: ./php-backend
      dockerfile: Dockerfile
    container_name: fafi-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_DRIVER=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=fafi_1_6
      - DB_USER=fafi_user
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - WS_PORT=8080
      - CORS_ALLOWED_ORIGINS=https://your-domain.com
    volumes:
      - ./php-backend:/var/www/html
      - ./logs:/var/log
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fafi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: fafi-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=fafi_1_6
      - MYSQL_USER=fafi_user
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./php-backend/database/schema_mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./php-backend/database/seed_mysql.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "3306:3306"
    networks:
      - fafi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis for caching/sessions (optional)
  redis:
    image: redis:7-alpine
    container_name: fafi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fafi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx Reverse Proxy (for SSL termination) - optional separate container
  # proxy:
  #   image: nginx:alpine
  #   container_name: fafi-proxy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/conf.d:/etc/nginx/conf.d
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   depends_on:
  #     - app
  #   networks:
  #     - fafi-network

volumes:
  db_data:
  redis_data:

networks:
  fafi-network:
    driver: bridge