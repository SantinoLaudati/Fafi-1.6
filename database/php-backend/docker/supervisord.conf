[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.err.log
; php-fpm arranca como root: el master abre /proc/self/fd/2 (error_log de la imagen) y falla con "Permission denied" si arranca como www-data.
; Los workers ya bajan a www-data por "user = www-data" en www.conf.
user=root

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log
user=root

[program:websocket]
command=php /var/www/html/websocket/server.php
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/websocket.log
stderr_logfile=/var/log/supervisor/websocket.err.log
user=www-data
environment=WS_PORT=8080

[program:php-fpm-health]
command=/bin/bash -c "while true; do sleep 30; curl -f http://localhost/health || exit 1; done"
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/health.log
stderr_logfile=/var/log/supervisor/health.err.log