; PHP-FPM pool configuration for Fafi-1.6 (Docker)
[www]

; Run as the web user
user = www-data
group = www-data

; Listen on TCP (matches fastcgi_pass 127.0.0.1:9000 en nginx)
listen = 127.0.0.1:9000

; Process manager
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; IMPORTANTE: conserva las variables de entorno del contenedor
; (DB_HOST, DB_PASSWORD, JWT_SECRET, WS_PORT, ...)
clear_env = no

; Logs
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php/error.log
php_admin_value[date.timezone] = UTC

; Límites
php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 10M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[max_execution_time] = 60