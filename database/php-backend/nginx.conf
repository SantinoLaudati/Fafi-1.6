# Fafi-1.6 PHP Backend - Nginx Configuration
# Modo demo: sirve API + WebSocket + frontends en HTTP (puerto 80).
# Colocar en /etc/nginx/sites-available/fafi-1.6 y enlazar a sites-enabled.
# Asume la ruta de instalacion /var/www/fafi-1.6 (ajusta si copias a otro lado).

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Raiz por defecto: API PHP
    root /var/www/fafi-1.6/database/php-backend;
    index index.php index.html;

    # --- Compresion ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/xml text/plain;

    # --- Limites ------------------------------------------------------------
    client_max_body_size 10M;

    # --- API routes ---------------------------------------------------------
    location /api/ {
        try_files $uri $uri/ /api/index.php?$query_string;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # --- WebSocket (servidor de juego en el puerto 8080) --------------------
    location /game {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # --- PHP handling -------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Debian/Ubuntu: socket; si usas fpm en TCP usa fastcgi_pass 127.0.0.1:9000;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        fastcgi_param PHP_VALUE "upload_max_filesize=10M \n post_max_size=10M \n max_execution_time=60 \n memory_limit=256M";
    }

    # --- Frontend: juego (SPA) ----------------------------------------------
    location / {
        root /var/www/fafi-1.6/game-client;
        try_files $uri $uri/ /index.html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- Frontend: dev-website ----------------------------------------------
    location /dev-website/ {
        root /var/www/fafi-1.6;
        try_files $uri $uri/ /dev-website/index.html;
        expires 1h;
        access_log off;
    }

    # --- Archivos sensibles (no se sirven) ----------------------------------
    location ~ /\.(env|git|htaccess|htpasswd|web) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(sql|log|ini|conf|lock|md)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(composer|vendor|database|config)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Health check -------------------------------------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # --- Logs ---------------------------------------------------------------
    access_log /var/log/nginx/fafi-1.6-access.log;
    error_log /var/log/nginx/fafi-1.6-error.log;
}